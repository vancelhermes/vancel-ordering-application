# GitHub Actions CI for the WhatsApp order integration.

# Runs on every push to `main`/`develop` and on pull requests. It verifies the
# delivery with no external services:
#   1. `lint`  (pyright, optional) - static typing pass.
#   2. `test`  (unittest, stdlib) - the match/duplicate + approval-gate tests
#      run against the in-memory SQLite adapter so nothing external is needed.
#   3. `schema` - validates the SQL DDL parses (SQLite adapter parses the same
#      text we ship for PostgreSQL, so a parse failure fails the build).
#
# To extend to a real database, add a job that runs the PostgreSQL migration
# against a locally running pgsql container.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyright

      - name: Run lint (pyright)
        run: |
          pyright whatsapp_orders tests --ignore-paths whatsapp_orders/sqlite_impl.py

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

      - name: Schema sanity check
        run: |
          python - <<'PY'
          import ast, sys
          from pathlib import Path
          # The shipped PostgreSQL DDL should at least be syntactically valid.
          for f in ["whatsapp_orders/schema.py", "migrations/001_whatsapp_phone_orders.sql"]:
              src = Path(f).read_text()
              try:
                  ast.parse(src)
              except SyntaxError as e:
                  print(f"FAILED to parse {f}: {e}")
                  sys.exit(1)
          print("OK: all SQL/Python source parses")
          PY
